name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Validate MCPB manifest
        if: matrix.node-version == 22
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate .

      - name: Check tool catalogue is up to date
        # If a tool/prompt/resource was added or renamed, TOOLS.md must be
        # regenerated and committed. This step fails if it drifts.
        if: matrix.node-version == 22
        run: node scripts/generate-tools-catalog.mjs --check

      - name: Check Claude Code plugin manifests are up to date
        # plugin.json + .mcp.json are generated from manifest.json (single
        # source of truth for the 14 user_config options). This step fails if
        # they drift, same contract as the TOOLS.md check above.
        if: matrix.node-version == 22
        run: node scripts/generate-plugin-manifest.mjs --check

      - name: Verify version consistency
        if: matrix.node-version == 22
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          SERVER_VERSION=$(node -p "require('./server.json').version")
          GEMINI_VERSION=$(node -p "require('./gemini-extension.json').version")
          PLUGIN_VERSION=$(node -p "require('./plugins/boondmanager-mcp/.claude-plugin/plugin.json').version")
          MARKETPLACE_VERSION=$(node -p "require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === 'boondmanager-mcp').version")
          # The npm pin the plugin launches. This is the copy that fossilises
          # silently: a stale pin keeps installing an old release forever, with
          # nothing in the plugin UI hinting that it is not the announced version.
          PLUGIN_NPM_PIN=$(node -p "require('./plugins/boondmanager-mcp/.mcp.json').mcpServers.boondmanager.args.at(-1).split('@').at(-1)")
          echo "package.json:          $PKG_VERSION"
          echo "manifest.json:         $MANIFEST_VERSION"
          echo "server.json:           $SERVER_VERSION"
          echo "gemini-extension.json: $GEMINI_VERSION"
          echo "plugin.json:           $PLUGIN_VERSION"
          echo "marketplace.json:      $MARKETPLACE_VERSION"
          echo "plugin npm pin:        $PLUGIN_NPM_PIN"
          FAILED=0
          for pair in \
            "manifest.json:$MANIFEST_VERSION" \
            "server.json:$SERVER_VERSION" \
            "gemini-extension.json:$GEMINI_VERSION" \
            "plugin.json:$PLUGIN_VERSION" \
            "marketplace.json:$MARKETPLACE_VERSION" \
            "plugin npm pin:$PLUGIN_NPM_PIN"; do
            name="${pair%:*}"
            value="${pair##*:}"
            if [ "$value" != "$PKG_VERSION" ]; then
              echo "ERROR: $name is $value, expected $PKG_VERSION (package.json)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "Bump every version copy together — see CLAUDE.md §Releasing step 2."
            exit 1
          fi

      - name: Upload coverage
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage/
